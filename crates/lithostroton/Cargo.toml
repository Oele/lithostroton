[package]
name = "lithostroton"
description = "An OAuth 2.0 authorization server for Matrix homeservers, built to run inside the homeserver's process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# An in-memory `Host` for tests and labs, and a suite of checks a `Host` implementation can
# run against itself.
testing = []

[dependencies]
axum.workspace = true
tokio.workspace = true
tower.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
form_urlencoded.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
getrandom.workspace = true
subtle.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
lithostroton = { path = ".", features = ["testing"] }
http-body-util.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
