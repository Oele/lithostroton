[workspace]
resolver = "3"
members = ["crates/lithostroton"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/Oele/lithostroton"
authors = ["The lithostroton authors"]

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "form", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
form_urlencoded = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.3"
subtle = "2"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
